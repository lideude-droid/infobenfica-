<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Infobenfica</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-container" id="loginArea">
    <h1>Login Admin</h1>
    <form id="loginForm">
        <label>Utilizador</label>
        <input id="user" type="text" required>

        <label>Password</label>
        <input id="pass" type="password" required>

        <button type="submit">Entrar</button>
    </form>
</div>

<div class="admin-container hidden" id="dashboardArea">
    <h1>Dashboard</h1>
    <button id="btnCriar" type="button">Criar Notícia</button>
    <div id="listaNoticias"></div>
</div>

<div class="admin-container hidden" id="criarArea">
    <h1>Criar Notícia</h1>
    <form id="criarForm">
        <label>Título</label>
        <input id="tituloCriar" required>

        <label>Subtítulo</label>
        <input id="subtituloCriar">

        <label>Categoria</label>
        <select id="categoriaCriar">
            <option value="ultimas">Últimas</option>
            <option value="futebol">Futebol</option>
            <option value="modalidades">Modalidades</option>
            <option value="clube">Clube</option>
            <option value="opiniao">Opinião</option>
        </select>

        <label>Texto</label>
        <textarea id="textoCriar" required></textarea>

        <label>Imagem (URL)</label>
        <input id="imagemCriar" placeholder="https://...">

        <button type="submit">Guardar</button>
        <button type="button" id="cancelCriar">Cancelar</button>
    </form>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
