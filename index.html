<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Infobenfica — notícias do Benfica, futebol e modalidades.">
    <title>Infobenfica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon/favicon.ico">
</head>
<body>
<header class="site-header">
    <div class="topline">
        <div class="site-shell topline-inner">
            <span>Notícias do Benfica</span>
            <span>Atualizado diariamente</span>
        </div>
    </div>

    <div class="masthead site-shell">
        <a class="brand" href="index.html" aria-label="Infobenfica - início">
            <span class="brand-mark">I</span>
            <span>infobenfica</span>
        </a>

        <button class="hamburger" id="hamburgerBtn" type="button"
                aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu">
            <span></span><span></span><span></span>
        </button>

        <nav class="menu-desktop" aria-label="Navegação principal">
            <ul>
                <li><a class="active" href="#" data-cat="ultimas">Últimas</a></li>
                <li><a href="#" data-cat="futebol">Futebol</a></li>
                <li><a href="#" data-cat="modalidades">Modalidades</a></li>
                <li><a href="#" data-cat="clube">Clube</a></li>
                <li><a href="#" data-cat="opiniao">Opinião</a></li>
            </ul>
        </nav>
    </div>

    <div class="nav-rule"></div>
</header>

<aside id="mobileMenu" class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-head">
        <strong>Menu</strong>
        <button type="button" id="closeMenu" aria-label="Fechar menu">×</button>
    </div>
    <nav aria-label="Navegação mobile">
        <ul>
            <li><a href="#" data-cat="ultimas">Últimas</a></li>
            <li><a href="#" data-cat="futebol">Futebol</a></li>
            <li><a href="#" data-cat="modalidades">Modalidades</a></li>
            <li><a href="#" data-cat="clube">Clube</a></li>
            <li><a href="#" data-cat="opiniao">Opinião</a></li>
        </ul>
    </nav>
</aside>

<main class="site-shell main-content">
    <div class="section-heading">
        <div>
            <span class="eyebrow">INFÓRMATE</span>
            <h1 id="tituloCategoria">Últimas Notícias</h1>
        </div>
        <span class="section-line"></span>
    </div>

    <div class="grid" id="newsGrid" aria-live="polite"></div>
</main>

<footer class="site-footer">
    <div class="site-shell footer-inner">
        <a class="footer-brand" href="index.html">infobenfica</a>
        <p>Notícias, análise e informação sobre o Benfica.</p>
        <p class="copyright">© 2026 Infobenfica</p>
    </div>
</footer>

<script type="module" src="script.js"></script>
</body>
</html>
