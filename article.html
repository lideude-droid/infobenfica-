<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infobenfica - Artigo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">Infobenfica</div>
</header>

<section class="artigo-container">
    <img id="artigoImagem" class="noticia-img">
    <h1 id="artigoTitulo"></h1>
    <p id="artigoTexto"></p>
</section>

<script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById("artigoTitulo").innerText = params.get("titulo");
    document.getElementById("artigoTexto").innerText = params.get("texto");
    document.getElementById("artigoImagem").src = params.get("imagem");
</script>

</body>
</html>
